name: Build release packages
run-name: Prepare release packages for ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'ci-release-test-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing remote tag to build (for example 0.2.0)
        required: true
        type: string
      prerelease:
        description: Mark a newly created release draft as a prerelease
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-packages-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Test release safeguards
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Resolve tag and check release
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python .github/scripts/release_packages.py prepare

  build:
    needs: prepare
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      # Keep the workflow's verifier separate from the tag's build scripts.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build package from the resolved commit
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: python source/deployment/build-package.py "$PACKAGE_VERSION" --arch "$PACKAGE_ARCH"
      - name: Verify package and native image contents
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: >-
          python .github/scripts/release_packages.py verify
          --directory source/deployment/build_output --arch "$PACKAGE_ARCH" --images
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-packages-${{ matrix.arch }}
          path: |
            source/deployment/build_output/micamera-net-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
            source/deployment/build_output/micamera-net-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  draft:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-packages-*
          merge-multiple: true
          path: release-assets
      - name: Verify and upload to release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_PRERELEASE: ${{ github.event_name == 'push' || inputs.prerelease }}
        run: python .github/scripts/release_packages.py publish --directory release-assets
