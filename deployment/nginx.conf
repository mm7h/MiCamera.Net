# Rendered by the official Nginx image entrypoint (envsubst) before the server starts.
# MICAMERA_LAN_IP and MICAMERA_API_TOKEN are exported by 16-micamera-api-proxy.envsh,
# so the bridge Bearer Token never reaches the browser or the image layers.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location /healthz { access_log off; return 200 'ok'; }
    # Same-origin proxy: the browser calls this server, which authenticates upstream.
    location /api/ {
        proxy_pass http://${MICAMERA_LAN_IP}:5080;
        proxy_set_header Authorization "Bearer ${MICAMERA_API_TOKEN}";
    }
    location = /swagger { return 302 /swagger/; }
    location /swagger/ {
        proxy_pass http://${MICAMERA_LAN_IP}:5080;
    }
    location / { try_files $uri $uri/ /index.html; }
}
